<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transposition Cipher UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card {
            margin-top: 40px; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); background: white;
        }
        .section-title {
            color: #007bff; font-weight: 700; margin-top: 20px;
            text-transform: uppercase; font-size: 0.9rem;
        }
        .result-box {
            margin-top: 15px; padding: 15px; border-radius: 8px;
            background: #e9ecef; border: 2px dashed #ced4da;
            font-family: 'Courier New', Courier, monospace; font-weight: bold; min-height: 50px;
        }
        label { font-weight: 600; color: #495057; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="main-card">
                    <h2 class="text-center mb-2">TRANSPOSITION CIPHER</h2>
                    <p class="text-center text-muted small mb-4">UI Form cho Yêu cầu số 2</p>
                    <hr>

                    <div class="section-title">🔒 Encryption (Mã hóa)</div>
                    <div class="form-group mt-3">
                        <label>Plaintext</label>
                        <textarea id="plainText" class="form-control" rows="2" placeholder="Nhập bản rõ..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Key (Số cột)</label>
                        <input id="keyEncrypt" type="number" class="form-control" value="3" min="2">
                    </div>
                    <button class="btn btn-primary" onclick="encryptTransposition()">ENCRYPT</button>
                    <div id="encryptResult" class="result-box">Chưa có kết quả...</div>

                    <hr class="mt-4">

                    <div class="section-title">🔓 Decryption (Giải mã)</div>
                    <div class="form-group mt-3">
                        <label>Ciphertext</label>
                        <textarea id="cipherText" class="form-control" rows="2" placeholder="Nhập bản mã..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Key (Số cột)</label>
                        <input id="keyDecrypt" type="number" class="form-control" value="3" min="2">
                    </div>
                    <button class="btn btn-success" onclick="decryptTransposition()">DECRYPT</button>
                    <div id="decryptResult" class="result-box">Chưa có kết quả...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function encryptTransposition() {
            const text = document.getElementById("plainText").value;
            const key = document.getElementById("keyEncrypt").value;
            if(!text) { alert("Vui lòng nhập văn bản!"); return; }

            fetch("/transposition/encrypt", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text, key: key })
            }).then(res => res.json()).then(data => {
                document.getElementById("encryptResult").innerText = data.result;
                document.getElementById("cipherText").value = data.result;
                document.getElementById("keyDecrypt").value = key;
            }).catch(err => alert("Lỗi kết nối Server!"));
        }

        function decryptTransposition() {
            const text = document.getElementById("cipherText").value;
            const key = document.getElementById("keyDecrypt").value;
            if(!text) { alert("Vui lòng nhập bản mã!"); return; }

            fetch("/transposition/decrypt", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text, key: key })
            }).then(res => res.json()).then(data => {
                document.getElementById("decryptResult").innerText = data.result;
            }).catch(err => alert("Lỗi kết nối Server!"));
        }
    </script>
</body>
</html>
